<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- TOP BAR -->
  <header class="topbar">
    <button class="hamburger" id="hamburger" type="button" aria-label="Open menu">☰</button>

    <div class="titleWrap">
      <h1 class="pageTitle">Calendar</h1>
      <div class="pageSub">All doctors availability (weekly view)</div>
    </div>

    <div class="topRight">
      <button class="logout-btn" type="button">Logout</button>
      <div class="logoWrap" aria-label="Logo">
        <img class="logoImg" src="../images/logo.png" alt="logo" />
      </div>
    </div>
  </header>

  <!-- OFF-CANVAS SIDE MENU -->
  <aside class="sideMenu" id="sideMenu" aria-label="Side menu">
    <div class="sideMenuHeader">
      <div class="sideMenuTitle">Menu</div>
      <button class="closeBtn" id="closeMenuBtn" type="button" aria-label="Close menu">✕</button>
    </div>

    <nav class="sideMenuLinks">
      <a href="home.html">Personal Portal</a>
      <a href="doctor.html">Doctor Availability</a>
      <a class="active" href="calendar.html">Calendar</a>
      <a href="records.html">Records</a>
    </nav>
  </aside>

  <div class="menuOverlay" id="menuOverlay" aria-hidden="true"></div>

  <main class="page">
    <section class="panel">
      <div class="panelHeader">
        <div>
          <div class="panelTitle">Weekly availability</div>
          <div class="muted">Pick a week start date (Monday) and refresh.</div>
        </div>

        <div class="controls">
          <div class="control">
            <label for="weekStart">Week start</label>
            <input id="weekStart" type="date" />
          </div>
          <button class="btn ghost" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>

      <div id="statusMsg" class="status" aria-live="polite"></div>

      <div class="legend">
        <div class="chip"><span class="dot ok"></span> Many slots</div>
        <div class="chip"><span class="dot mid"></span> Some slots</div>
        <div class="chip"><span class="dot low"></span> Few slots</div>
        <div class="chip"><span class="dot none"></span> None</div>
      </div>

      <div class="calendarWrap">
        <div id="calendarGrid" class="calendarGrid" aria-live="polite"></div>
      </div>

    </section>
  </main>

  <footer class="footer">Footer</footer>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Health Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <style>
    :root {
      /* Blues */
      --blue-dark:    #0B2C4A;
      --blue-medium:  #155E9B;
      --blue-bright:  #2F80ED;
      --blue-light:   #EAF2FB;

      /* Greens */
      --green-dark:   #1F7A5C;
      --green:        #27AE60;
      --green-light:  #E9F7F1;

      /* Neutrals */
      --white:        #FFFFFF;
      --black:        #000000;
      --gray-very-dark:#1C1F24;
      --gray-dark:    #3A3F45;
      --gray:         #6B7280;
      --gray-light:   #D1D5DB;
      --gray-very-light: #F5F7FA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background-color: var(--gray-very-light);
      color: var(--gray-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background-color: var(--white);
      border-bottom: 1px solid var(--gray-light);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .left {
      width: 44px; /* placeholder for symmetry */
    }

    .center {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-icon {
      font-size: 26px;
      color: var(--blue-dark);
      cursor: pointer;
      user-select: none;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue-medium));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(47,128,237,0.25);
    }

    .logout-btn {
      background-color: var(--blue-dark);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background-color: #081f38;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--white);
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      transition: left 0.3s ease;
      z-index: 200;
      padding-top: 70px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-light);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--blue-dark);
    }

    .sidebar a {
      display: block;
      padding: 16px 24px;
      color: var(--gray-dark);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }

    .sidebar a:hover {
      background: var(--blue-light);
      color: var(--blue-bright);
    }

    .sidebar a.active {
      background: var(--blue-light);
      color: var(--blue-bright);
      border-left: 4px solid var(--blue-bright);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 150;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    /* Main content */
    main {
      flex: 1;
      padding: 32px 24px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }

    .card {
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
      overflow: hidden;
      transition: all 0.18s;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--blue-medium);
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .card.calendar     { color: var(--green); }
    .card.appointments { color: var(--blue-bright); }
    .card.records      { color: var(--blue-dark); }

    /* Footer */
    footer {
      background-color: var(--gray-very-dark);
      color: var(--gray-light);
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      margin-top: auto;
    }

    @media (max-width: 640px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      header {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="left">
      <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>

    <div class="center">
      <div class="logo">H</div>
    </div>

    <div>
      <button class="logout-btn">Logout</button>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">Menu</div>
    <a href="#" class="active">Personal Portal</a>
    <a href="#">Doctor Availability</a>
  </div>

  <!-- Overlay for closing sidebar on mobile/desktop click outside -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main>
    <div class="dashboard-grid">
      <div class="card calendar">Calendar</div>
      <div class="card appointments">Appointments</div>
      <div class="card records">Records</div>
    </div>
  </main>

  <footer>
    © 2026 Personal Health Portal • All rights reserved
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Health Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
    
</head>
<body>

  <header>
    <div class="left">
      <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </div>

    <div class="center">
      <div class="logo">H</div>
    </div>

    <div>
      <button class="logout-btn">Logout</button>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">Menu</div>
    <a href="#" class="active">Personal Portal</a>
    <a href="#">Doctor Availability</a>
  </div>

  <!-- Overlay for closing sidebar on mobile/desktop click outside -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main>
    <div class="dashboard-grid">
      <div class="card calendar" id="goCalendar">Calendar</div>
      <div class="card appointments" id="goAppointments">Appointments</div>
      <div class="card records" id="goRecords">Records</div>
    </div>
  </main>

  <footer>
    © 2026 Personal Health Portal • All rights reserved
  </footer>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Appointments</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="appointments.css" />
</head>
<body>
  <header class="topbar">
    <button class="hamburger" id="hamburger" type="button" aria-label="Open menu">&#9776;</button>

    <div class="titleWrap">
      <h1 class="pageTitle">My Appointments</h1>
      <div class="pageSub">View and manage your scheduled appointments</div>
    </div>

    <div class="topRight">
      <button class="logout-btn" type="button">Logout</button>
      <div class="logoWrap" aria-label="Logo">
        <img class="logoImg" src="images/logo.png" alt="logo" />
      </div>
    </div>
  </header>

  <aside class="sideMenu" id="sideMenu" aria-label="Side menu">
    <div class="sideMenuHeader">
      <div class="sideMenuTitle">Menu</div>
      <button class="closeBtn" id="closeMenuBtn" type="button" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sideMenuLinks">
      <a href="home.html">Personal Portal</a>
      <a href="doctor.html">Doctor Availability</a>
      <a href="records.html">Records</a>
      <a class="active" href="appointments.html">My Appointments</a>
    </nav>
  </aside>

  <div class="menuOverlay" id="menuOverlay" aria-hidden="true"></div>

  <main class="page appointmentsPage">
    <section class="panel appointmentsPanel">
      <div id="statusMsg" class="status" aria-live="polite"></div>

      <div class="appointmentsFilters">
        <button class="btn ghost filterBtn active" data-filter="all">All</button>
        <button class="btn ghost filterBtn" data-filter="confirmed">Confirmed</button>
        <button class="btn ghost filterBtn" data-filter="cancelled">Cancelled</button>
      </div>

      <div id="appointmentsList" class="appointmentsList" aria-live="polite">
        <div class="emptyState">Loading your appointments...</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const statusMsg = document.getElementById('statusMsg');
    const appointmentsList = document.getElementById('appointmentsList');
    const filtersContainer = document.querySelector('.appointmentsFilters');
    const authUser = getAuthUser();
    const state = {
      appointments: [],
      activeFilter: 'all',
      pendingCancelIds: new Set(),
    };

    if (!authUser) {
      window.location.href = 'index.html';
    } else {
      initializeAppointmentsPage();
    }

    async function initializeAppointmentsPage() {
      filtersContainer?.addEventListener('click', handleFilterClick);
      appointmentsList?.addEventListener('click', handleAppointmentsClick);
      await loadAppointments();
    }

    async function loadAppointments() {
      try {
        const { data } = await apiRequest(`/user/${authUser.id}/appointments`, {
          defaultErrorMessage: 'Could not load appointments',
        });

        state.appointments = Array.isArray(data.appointments) ? data.appointments : [];
        state.pendingCancelIds.clear();
        renderAppointments();
        renderStatusMessage(statusMsg, '');
      } catch (error) {
        renderStatusMessage(statusMsg, 'Could not connect to the server.', 'err');
      }
    }

    function formatDateDisplay(dateStr) {
      const date = new Date(dateStr);
      return new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric',
      }).format(date);
    }

    function getFilteredAppointments() {
      if (state.activeFilter === 'all') {
        return state.appointments;
      }

      return state.appointments.filter((appointment) => appointment.status === state.activeFilter);
    }

    function updateFilterButtons() {
      document.querySelectorAll('.filterBtn').forEach((button) => {
        button.classList.toggle('active', button.dataset.filter === state.activeFilter);
      });
    }

    function renderAppointments() {
      const visibleAppointments = getFilteredAppointments();
      appointmentsList.innerHTML = '';

      if (state.appointments.length === 0) {
        appointmentsList.innerHTML = '<div class="emptyState">No appointments scheduled yet.</div>';
        updateFilterButtons();
        return;
      }

      if (visibleAppointments.length === 0) {
        const emptyMessages = {
          confirmed: 'No confirmed appointments.',
          cancelled: 'No cancelled appointments.',
        };
        appointmentsList.innerHTML =
          `<div class="emptyState">${emptyMessages[state.activeFilter] || 'No appointments found.'}</div>`;
        updateFilterButtons();
        return;
      }

      visibleAppointments.forEach((appointment) => {
        const appointmentCard = document.createElement('div');
        appointmentCard.className = `appointmentCard ${appointment.status}`;
        appointmentCard.id = `apt-${appointment.id}`;

        const dateDisplay = formatDateDisplay(appointment.appointment_date);
        const timeDisplay = appointment.appointment_time;
        const doctorName = appointment.doctor_name || 'Unknown Doctor';
        const specialty = appointment.doctor_specialty || '';
        const room = appointment.room_number || '';
        const isPendingCancel = state.pendingCancelIds.has(String(appointment.id));

        let statusBadge = 'Confirmed';
        let statusClass = 'confirmed';
        if (appointment.status === 'cancelled') {
          statusBadge = isPendingCancel ? 'Cancelling...' : 'Cancelled';
          statusClass = 'cancelled';
        }

        appointmentCard.innerHTML = `
          <div class="appointmentCardHeader">
            <div class="appointmentCardTitle">
              <h3>${doctorName}</h3>
              <p class="specialty">${specialty}</p>
            </div>
            <span class="appointmentStatus ${statusClass}">${statusBadge}</span>
          </div>

          <div class="appointmentCardDetails">
            <div class="detailItem">
              <span class="label">Date</span>
              <span class="value">${dateDisplay}</span>
            </div>
            <div class="detailItem">
              <span class="label">Time</span>
              <span class="value">${timeDisplay}</span>
            </div>
            <div class="detailItem">
              <span class="label">Location</span>
              <span class="value">${room}</span>
            </div>
          </div>

          <div class="appointmentCardActions">
            ${appointment.status === 'confirmed'
              ? `<button class="btn danger cancelBtn" data-apt-id="${appointment.id}">Cancel Appointment</button>`
              : `<span class="mutedText">${isPendingCancel ? 'Cancelling appointment...' : 'This appointment has been cancelled'}</span>`
            }
          </div>
        `;

        appointmentsList.appendChild(appointmentCard);
      });

      updateFilterButtons();
    }

    function handleFilterClick(event) {
      const button = event.target.closest('.filterBtn');
      if (!button) {
        return;
      }

      state.activeFilter = button.dataset.filter || 'all';
      renderAppointments();
    }

    async function handleAppointmentsClick(event) {
      const cancelButton = event.target.closest('.cancelBtn');
      if (!cancelButton) {
        return;
      }

      const appointmentId = cancelButton.dataset.aptId;
      if (!appointmentId || state.pendingCancelIds.has(appointmentId)) {
        return;
      }

      const appointment = state.appointments.find((item) => String(item.id) === appointmentId);
      if (!appointment || appointment.status !== 'confirmed') {
        return;
      }

      const confirmCancel = confirm('Are you sure you want to cancel this appointment? This will free up the time slot for other users.');
      if (!confirmCancel) {
        return;
      }

      const previousStatus = appointment.status;
      appointment.status = 'cancelled';
      state.pendingCancelIds.add(appointmentId);
      renderAppointments();
      renderStatusMessage(statusMsg, 'Cancelling appointment...', null);

      try {
        const { data } = await apiRequest(`/appointments/${appointmentId}/cancel`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
          },
          defaultErrorMessage: 'Could not cancel appointment',
        });

        state.pendingCancelIds.delete(appointmentId);
        appointment.status = data.status || 'cancelled';
        renderAppointments();
        renderStatusMessage(statusMsg, 'Appointment cancelled successfully', 'ok');
      } catch (error) {
        state.pendingCancelIds.delete(appointmentId);
        appointment.status = previousStatus;
        renderAppointments();
        renderStatusMessage(statusMsg, error.message || 'Could not connect to the server.', 'err');
      }
    }
  </script>
</body>
</html>
